name: Image upload regression

on:
  push:
    branches:
      - fix/max-image-upload-photos

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture compiler output
        shell: bash
        run: |
          cd Max
          set +e
          g++ -std=gnu++98 -Wall -Wextra -Werror api/maxcore.cpp api/maxclient.cpp tests/test_image_upload.cpp -o tests/test_image_upload > ../compile.log 2>&1
          status=$?
          echo "$status" > ../compile.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: image-upload-compile
          path: |
            compile.log
            compile.status
      - name: Run regression if compiled
        shell: bash
        run: |
          test "$(cat compile.status)" = "0"
          cd Max
          ./tests/test_image_upload
