name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          g++ --version
          python3 --version
      - name: MAX API unit tests (C++98) + mirror source check
        run: bash ./Max/tests/run.sh
      - name: MAX HTTP E2E
        run: bash ./Max/e2e/run_e2e.sh
